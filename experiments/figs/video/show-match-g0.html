<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>PoolHall 中式八球对局 · 回放</title>
<style>
:root {
  --bg: #f7f4ee; --bg-alt: #ece8dc; --ink: #2b2b2b; --ink-soft: #5a5d61;
  --felt: #1B4D3E; --felt-light: #d4e2dc;
  --A: #2D5E8A; --B: #C76B2D;
  --miss: #B94A48; --pot: #1B4D3E;
  --grid: #d4cfba;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; line-height: 1.5; }
body { display: flex; flex-direction: column; }
header { padding: 16px 24px; border-bottom: 1px solid var(--grid); display: flex;
  flex: 0 0 auto; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
h1 { font-size: 18px; margin: 0; }
.meta { color: var(--ink-soft); font-size: 13px; }
.meta .A { color: var(--A); font-weight: 700; }
.meta .B { color: var(--B); font-weight: 700; }
.status { font-size: 13px; }
.main { min-height: 0; flex: 1 1 auto; padding: 16px 24px; overflow: hidden; display: grid;
  grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: stretch; }
.play-column { min-height: 0; overflow-y: auto; scrollbar-gutter: stable; }
.table-frame { background: var(--felt); border-radius: 6px; padding: 8px; position: relative; aspect-ratio: 2.04; }
.table-frame svg { width: 100%; height: 100%; display: block; }
.stage { position: relative; min-width: 0; }
.controls { min-height: 52px; margin-bottom: 10px; padding: 0 0 10px; display: flex; align-items: center;
  gap: 8px; flex-wrap: wrap; background: transparent; border: 0; border-bottom: 1px solid var(--grid); }
.control-spacer { flex: 1; }
.control, .control-field { min-height: 44px; border: 0; border-radius: 5px;
  background: transparent; color: var(--ink); font: inherit; font-weight: 650; }
.control { padding: 0 13px; cursor: pointer; }
.control.primary { background: var(--felt); border-color: var(--felt); color: #fff; }
.control:hover:not(:disabled), .control-field:hover:not(:disabled) { background: #e8ece9; }
.control.primary:hover:not(:disabled) { background: #143f33; }
.control:active:not(:disabled) { transform: translateY(1px); }
.control:focus-visible, .control-field:focus-visible { outline: 3px solid #a9d8c5; outline-offset: 1px; }
.control:disabled, .control-field:disabled { cursor: not-allowed; opacity: .48; }
.control-label { display: flex; align-items: center; gap: 7px; min-height: 44px; padding-left: 5px;
  color: var(--ink-soft); font-size: 13px; font-weight: 650; }
.control-field { height: 36px; min-height: 36px; padding: 0 5px; border-radius: 0;
  border-bottom: 1px solid #a9a99f; font-family: "JetBrains Mono", monospace;
  font-variant-numeric: tabular-nums; }
#max-shots { width: 68px; }
#playback-speed { width: 64px; }
.control-status { min-width: 84px; padding: 0 8px; color: var(--ink-soft); font-size: 12px; text-align: right; }
body.offline .server-control { display: none; }
.stage:fullscreen { display: flex; align-items: center; justify-content: center; padding: 12px; background: #151716; }
.stage:fullscreen .table-frame { width: 100%; max-height: calc(100vh - 24px); margin: auto; }
.stage:fullscreen .controls { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
  z-index: 10; width: max-content; max-width: calc(100vw - 24px); margin: 0; padding: 6px;
  border-color: #4b4e4c; background: #232624; color: #fff; opacity: 0; transform: translate(-50%, 12px);
  transition: opacity 180ms cubic-bezier(.22,1,.36,1), transform 180ms cubic-bezier(.22,1,.36,1); }
.stage:fullscreen.controls-visible .controls, .stage:fullscreen .controls:focus-within {
  opacity: 1; transform: translate(-50%, 0); }
.stage:fullscreen .control:not(.primary), .stage:fullscreen .control-field {
  background: #303431; border-color: #5d625e; color: #fff; }
.stage:fullscreen .control-label, .stage:fullscreen .control-status { color: #e4e8e5; }
.legend { padding: 8px 12px; font-size: 12px; color: var(--ink-soft); display: flex; gap: 16px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 1.5px; }
/* 知行差距可视化：预测线（AI 的计划）vs 实际轨迹 */
.aim-layer { transition: opacity .5s ease; }
.aim-pred { stroke: rgba(58,92,128,.9); stroke-width: .0055; stroke-dasharray: .03 .024; }
.aim-obj { stroke: rgba(58,92,128,.65); stroke-width: .0045; }
.aim-act { fill: none; stroke: #E8872D; stroke-width: .008; stroke-linecap: round; opacity: .92; }
/* 大字幕（开球/进球连击/白球进袋嘲讽/胜负） */
.caption { position: absolute; left: 50%; top: 11%; transform: translate(-50%, 0);
  pointer-events: none; text-align: center; opacity: 0; z-index: 5; white-space: nowrap; }
.caption b { display: block; font-size: clamp(22px, 4.6vw, 46px); font-weight: 800;
  letter-spacing: .08em; color: #F7F4EE; text-shadow: 0 2px 16px rgba(11,20,16,.6), 0 0 2px rgba(11,20,16,.8); }
.caption span { display: block; margin-top: 3px; font-size: 13px; color: #F1EDE3;
  text-shadow: 0 1px 8px rgba(11,20,16,.7); opacity: .95; }
.caption.show { animation: capPop .5s cubic-bezier(.22,1,.36,1) both; }
.caption.show.out { animation: capFade .38s ease both; }
.caption.mock b { color: #FFD9A0; }
.caption.mock span { color: #E8C9A0; font-style: italic; }
.caption.mock span:first-of-type { font-style: normal; color: #F4EBDA; opacity: .95; }
.caption.mock span:first-of-type::before { content: "❝ "; opacity: .6; }
.caption.victory b { color: #E8B84B; }
.caption.read b { color: #F5E6B8; text-shadow: 0 2px 18px rgba(232,184,75,.45), 0 0 2px rgba(11,20,16,.8); }
.caption.read span { color: #E8B84B; }
.caption.read span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; max-width: min(72vw, 640px); margin: 4px auto 0; font-size: 12px; }
/* AI 思路面板：新计划/读人推理到来时脉冲提醒视线 */
.ai-panel.pulse { animation: panelPulse 1.1s ease-out 3; }
@keyframes panelPulse { 0% { box-shadow: 0 0 0 0 rgba(27,77,62,.0); background: rgba(169,216,197,.38); }
  60% { background: rgba(169,216,197,.18); } 100% { box-shadow: 0 0 0 6px rgba(169,216,197,0); background: transparent; } }
.caption.streak b { font-size: clamp(18px, 3vw, 30px); color: #F5E6B8; }
@keyframes capPop { from { opacity: 0; transform: translate(-50%, 12px) scale(.82); }
  to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@keyframes capFade { from { opacity: 1; } to { opacity: 0; } }
/* 震屏：开球轻震 / 白球进袋重震 */
@keyframes tableShake { 0%,100% { transform: translate(0,0) rotate(0); }
  18% { transform: translate(3px,-2px) rotate(.3deg); } 36% { transform: translate(-3px,2px) rotate(-.25deg); }
  54% { transform: translate(2px,2px) rotate(.18deg); } 72% { transform: translate(-2px,-1px) rotate(-.12deg); } }
.table-frame.shake { animation: tableShake .5s cubic-bezier(.36,.07,.19,.97); }
.table-frame.shake-hard { animation: tableShake .75s cubic-bezier(.36,.07,.19,.97); }
.side { height: 100%; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.kpi { padding: 4px 4px 16px; border-bottom: 1px solid var(--grid); }
.kpi h3 { margin: 0 0 6px; font-size: 12px; color: var(--ink-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.kpi .v { font-size: 18px; font-weight: 700; font-family: "JetBrains Mono", monospace; }
.kpi .sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
.kpi .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: baseline; }
.ai-panel { max-height: 42%; padding: 12px 4px 14px; overflow-y: auto; border-bottom: 1px solid var(--grid); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head h2 { margin: 0; font-size: 15px; }
.ai-phase { color: var(--ink-soft); font-size: 12px; }
.ai-phase::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px;
  border-radius: 50%; background: currentColor; }
.ai-phase.thinking { color: var(--felt); }
.ai-shot { margin-bottom: 7px; font-size: 16px; font-weight: 750; }
.plan-list { display: grid; gap: 6px; margin: 0; }
.plan-row { display: grid; grid-template-columns: 46px 1fr; gap: 10px; }
.plan-row dt { color: var(--ink-soft); font-size: 12px; }
.plan-row dd { margin: 0; color: var(--ink); font-size: 13px; line-height: 1.45; }
.confidence { display: inline-flex; align-items: center; gap: 5px; }
.confidence i { width: 6px; height: 6px; border-radius: 50%; background: var(--felt); }
.plan-review { margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--grid);
  color: var(--ink-soft); font-size: 13px; }
.event-panel { min-height: 0; padding-top: 14px; display: flex; flex: 1; flex-direction: column; }
.event-panel .section-head { padding-inline: 4px; }
.log { flex: 1; min-height: 0; overflow-y: auto; font-family: "JetBrains Mono", monospace; font-size: 12px; }
.log-entry { padding: 9px 4px; border-bottom: 1px solid var(--grid); display: flex; gap: 10px; align-items: baseline; }
.log-entry:last-child { border-bottom: none; }
.log-entry .who { font-weight: 700; min-width: 32px; }
.log-entry.A .who { color: var(--A); }
.log-entry.B .who { color: var(--B); }
.log-entry .pot { color: var(--pot); font-weight: 700; }
.log-entry .miss { color: var(--miss); }
.log-entry .foul { color: var(--miss); font-weight: 700; }
.placeholder { color: var(--felt-light); padding: 20px; text-align: center; font-style: italic; }
.play-column, .ai-panel, .log { scrollbar-width: thin; scrollbar-color: #a9afa9 transparent; }
.play-column::-webkit-scrollbar, .ai-panel::-webkit-scrollbar, .log::-webkit-scrollbar { width: 6px; }
.play-column::-webkit-scrollbar-thumb, .ai-panel::-webkit-scrollbar-thumb, .log::-webkit-scrollbar-thumb {
  border-radius: 6px; background: #a9afa9; }
@media (max-width: 1000px) {
  .main { grid-template-columns: 1fr; align-items: start; overflow-y: auto; }
  .play-column { overflow: visible; }
  .side { height: auto; min-height: 0; overflow: visible; }
  .ai-panel { max-height: none; overflow: visible; }
  .event-panel { min-height: 420px; }
}
@media (max-width: 680px) {
  .main { padding: 10px; }
  header { padding: 12px; }
  .control { flex: 1 1 auto; padding-inline: 10px; }
  .control-spacer { display: none; }
  .control-status { flex: 1 0 100%; text-align: left; min-height: 24px; }
  .side { height: auto; min-height: 0; }
  .event-panel { min-height: 360px; }
  .log { max-height: 480px; }
}
@media (prefers-reduced-motion: reduce) {
  .control, .stage:fullscreen .controls { transition: none; }
  .table-frame.shake, .table-frame.shake-hard { animation: none; }
  .caption.show, .caption.show.out { animation: none; }
  .aim-layer { transition: none; }
  .ai-panel.pulse { animation: none; }
}
</style>
</head>

<header>
  <div class="play-column">
    <h1>PoolHall · 中式八球对局</h1>
    <div class="meta" id="meta">连接中...</div>
  </div>
  <div class="status" id="status">⏳ 等待连接</div>
</header>

<div class="main">
  <div>
    <div class="stage" id="stage">
    <div class="controls" role="toolbar" aria-label="对局与播放控制">
      <button class="control primary server-control" id="new-match" type="button" disabled>＋ 开新一局</button>
      <button class="control" id="pause-playback" type="button" disabled>Ⅱ 暂停</button>
      <button class="control" id="replay-match" type="button" disabled>↻ 重新播放</button>
      <label class="control-label" for="playback-speed">速度
        <select class="control-field" id="playback-speed" aria-label="播放速度">
          <option value="0.5">0.5×</option><option value="1" selected>1×</option>
          <option value="2">2×</option><option value="4">4×</option>
        </select>
      </label>
      <label class="control-label server-control" for="max-shots">最大杆数
        <input class="control-field" id="max-shots" type="number" min="1" max="120" value="60" inputmode="numeric"/>
      </label>
      <div class="control-spacer"></div>
      <button class="control" id="fullscreen-table" type="button">⛶ 全屏球桌</button>
      <span class="control-status" id="control-status" role="status" aria-live="polite">等待连接</span>
    </div>
    <div class="table-frame" id="table">
      <div class="placeholder">球台将在第一杆时激活</div>
    </div>
    <div class="caption" id="caption" aria-live="polite"></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--A)"></i>A 选手</span>
      <span><i style="background:var(--B)"></i>B 选手</span>
      <span><i style="background:var(--pot)"></i>进球</span>
      <span><i style="background:var(--miss)"></i>未中/犯规</span>
      <span><i style="background:rgba(58,92,128,.9)"></i>预测线（AI 计划）</span>
      <span><i style="background:#E8872D"></i>实际轨迹</span>
    </div>
  </div>

  <div class="side">
    <div class="kpi">
      <div class="section-head"><h2>当前局况</h2></div>
      <div class="row">
        <div><div class="v" id="kpi-shot">-</div><div class="sub">杆数</div></div>
        <div><div class="v" id="kpi-turn">-</div><div class="sub">轮到</div></div>
        <div><div class="v" id="kpi-A">0</div><div class="sub">A 进球</div></div>
        <div><div class="v" id="kpi-B">0</div><div class="sub">B 进球</div></div>
      </div>
    </div>
    <section class="ai-panel" aria-labelledby="ai-plan-title">
      <div class="section-head">
        <h2 id="ai-plan-title">AI 本杆思路</h2>
        <span class="ai-phase" id="ai-phase">等待分析</span>
      </div>
      <div class="ai-shot" id="last-event">等待开局</div>
      <div class="sub" id="last-event-detail">AI 选择目标后将在这里展示公开计划</div>
      <dl class="plan-list">
        <div class="plan-row"><dt>观察</dt><dd id="plan-observation">—</dd></div>
        <div class="plan-row"><dt>判断</dt><dd id="plan-choice">—</dd></div>
        <div class="plan-row"><dt>走位</dt><dd id="plan-cue">—</dd></div>
        <div class="plan-row"><dt>风险</dt><dd id="plan-risk">—</dd></div>
        <div class="plan-row"><dt>信心</dt><dd id="plan-confidence">—</dd></div>
      </dl>
      <div class="plan-review" id="plan-review">本杆结束后显示复盘</div>
    </section>
    <section class="event-panel" aria-labelledby="events-title">
      <div class="section-head"><h2 id="events-title">最近事件</h2></div>
      <div class="log" id="log">
        <div class="placeholder">等待首杆...</div>
      </div>
    </section>
  </div>
</div>

<script>
let TABLE_W = 2.54, TABLE_H = 1.27;
let BREAK_LINE_X = TABLE_W / 4, FOOT_SPOT_X = (TABLE_W * 3) / 4;
const R = 0.028575;
const CUE_LENGTH = 1.4;
const svgNS = "http://www.w3.org/2000/svg";
const kpi = { shot: 0, turn: "-", A: 0, B: 0 };
const embeddedEvents = globalThis.POOLHALL_EVENTS;
let playbackSpeed = Array.isArray(embeddedEvents) ? 1 : 1;
let paused = false;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const BALL_COLORS = {
  1: "#F2C230", 2: "#2457A6", 3: "#C83F3F", 4: "#6A438C",
  5: "#E8872D", 6: "#2F7D4A", 7: "#8C2F3C", 8: "#202124",
};

function el(tag, attrs = {}, children = []) {
  const n = document.createElementNS(svgNS, tag);
  setAttrs(n, attrs);
  for (const c of children) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  return n;
}

function setAttrs(node, attrs) {
  for (const [key, value] of Object.entries(attrs)) {
    if (value === undefined || value === null) continue;
    node.setAttribute(key, value);
  }
}

function ballSpec(id) {
  const number = Number(id);
  if (!Number.isInteger(number) || number < 1 || number > 15) return null;
  const colorNumber = number > 8 ? number - 8 : number;
  return { number, color: BALL_COLORS[colorNumber], stripe: number > 8 };
}

function createCueStick() {
  const group = el("g", { class: "cue-stick", display: "none" });
  const styles = [
    { stroke: "rgba(18,20,18,.28)", "stroke-width": 0.027 },
    { stroke: "#D6B47A", "stroke-width": 0.014 },
    { stroke: "#75452E", "stroke-width": 0.021 },
    { stroke: "var(--A)", "stroke-width": 0.023 },
    { stroke: "var(--A)", "stroke-width": 0.011 },
  ];
  for (const style of styles) {
    group.appendChild(el("line", { ...style, "stroke-linecap": "round" }));
  }
  return group;
}

function updateCueStick(group, cue, angle, playerColor) {
  if (!cue || !Number.isFinite(angle)) {
    group.setAttribute("display", "none");
    return;
  }
  const rad = (angle * Math.PI) / 180;
  const dx = Math.cos(rad), dy = -Math.sin(rad);
  const point = (distance) => ({ x: cue.x - dx * distance, y: cue.y - dy * distance });
  const tipDistance = R + 0.012;
  const tip = point(tipDistance), joint = point(tipDistance + 0.86);
  const butt = point(tipDistance + CUE_LENGTH);
  const nearTip = point(tipDistance + 0.035), gripEnd = point(tipDistance + 1.08);
  const lines = group.querySelectorAll("line");
  setAttrs(lines[0], { x1: butt.x, y1: butt.y, x2: tip.x, y2: tip.y });
  setAttrs(lines[1], { x1: joint.x, y1: joint.y, x2: tip.x, y2: tip.y });
  setAttrs(lines[2], { x1: butt.x, y1: butt.y, x2: joint.x, y2: joint.y });
  setAttrs(lines[3], { x1: butt.x, y1: butt.y, x2: gripEnd.x, y2: gripEnd.y, stroke: playerColor });
  setAttrs(lines[4], { x1: nearTip.x, y1: nearTip.y, x2: tip.x, y2: tip.y, stroke: playerColor });
  setAttrs(group, { display: "inline", "aria-label": `球杆，瞄准 ${angle.toFixed(1)} 度` });
}

function createBallNode(id) {
  const group = el("g", { "data-ball-id": id, "data-ball-kind": id === "cue" ? "cue" : "object" });
  group.appendChild(el("line", { class: "motion-tail", display: "none",
    stroke: "rgba(235,242,238,.2)", "stroke-width": R * 0.7, "stroke-linecap": "round" }));
  group.appendChild(el("ellipse", { cx: R * 0.12, cy: R * 0.16,
    rx: R * 0.92, ry: R * 0.7, fill: "rgba(8,18,14,.2)" }));
  if (id === "cue") {
    group.appendChild(el("circle", { class: "ball-body", cx: 0, cy: 0, r: R,
      fill: "#FAFAF7", stroke: "#343A3D", "stroke-width": 0.0025 }));
    group.appendChild(el("circle", { cx: -R * 0.3, cy: -R * 0.32, r: R * 0.18,
      fill: "rgba(255,255,255,.72)" }));
    return group;
  }
  const spec = ballSpec(id);
  if (!spec) return group;
  const clipId = `ball-clip-${id}`;
  group.setAttribute("data-ball-kind", spec.stripe ? "stripe" : "solid");
  group.appendChild(el("clipPath", { id: clipId }, [el("circle", { cx: 0, cy: 0, r: R })]));
  group.appendChild(el("circle", { class: "ball-body", cx: 0, cy: 0, r: R,
    fill: spec.stripe ? "#F7F7F2" : spec.color }));
  if (spec.stripe) {
    group.appendChild(el("rect", { class: "ball-stripe", x: -R, y: -R * 0.42,
      width: R * 2, height: R * 0.84, fill: spec.color, "clip-path": `url(#${clipId})` }));
  }
  group.appendChild(el("circle", { cx: 0, cy: 0, r: R, fill: "none",
    stroke: "rgba(20,24,22,.62)", "stroke-width": 0.0025 }));
  group.appendChild(el("circle", { class: "ball-number", cx: 0, cy: 0, r: R * 0.5,
    fill: "#FAFAF7", stroke: "rgba(20,24,22,.2)", "stroke-width": 0.001 }));
  group.appendChild(el("text", { x: 0, y: R * 0.27, "text-anchor": "middle",
    "font-size": spec.number >= 10 ? 0.018 : 0.021, fill: "#171918", "font-weight": 750 }, [id]));
  return group;
}

function updateBallNode(group, p) {
  group.setAttribute("transform", `translate(${p.x} ${p.y})`);
  group.setAttribute("display", "inline");
  const tail = group.querySelector(".motion-tail");
  const speed = Math.hypot(p.vx ?? 0, p.vy ?? 0);
  if (speed <= 0.15) {
    tail.setAttribute("display", "none");
    return;
  }
  const trail = Math.min(R * 1.5, speed * 0.009);
  const ux = p.vx / speed, uy = p.vy / speed;
  setAttrs(tail, { display: "inline", x1: -ux * trail, y1: -uy * trail,
    x2: -ux * R * 0.3, y2: -uy * R * 0.3 });
}

const scene = { root: null, cue: null, ballLayer: null, balls: new Map() };

function createScene() {
  const root = el("svg", { viewBox: `0 0 ${TABLE_W} ${TABLE_H}`, preserveAspectRatio: "xMidYMid meet",
    role: "img", "aria-label": "中式八球球台" });
  root.appendChild(el("rect", { x: 0, y: 0, width: TABLE_W, height: TABLE_H, fill: "var(--felt)" }));
  root.appendChild(el("line", { class: "break-line", x1: BREAK_LINE_X, y1: 0.04,
    x2: BREAK_LINE_X, y2: TABLE_H - 0.04, stroke: "rgba(247,244,238,.2)",
    "stroke-width": 0.003, "stroke-dasharray": "0.018 0.018" }));
  root.appendChild(el("circle", { class: "foot-spot", cx: FOOT_SPOT_X, cy: TABLE_H / 2,
    r: 0.006, fill: "rgba(247,244,238,.35)" }));
  const pockets = [
    { id: "lt", x: 0, y: 0 }, { id: "rt", x: TABLE_W, y: 0 },
    { id: "lb", x: 0, y: TABLE_H }, { id: "rb", x: TABLE_W, y: TABLE_H },
    { id: "ct", x: TABLE_W / 2, y: 0 }, { id: "cb", x: TABLE_W / 2, y: TABLE_H },
  ];
  for (const p of pockets) {
    root.appendChild(el("circle", { cx: p.x, cy: p.y, r: 0.072, fill: "var(--bg)", stroke: "var(--ink-soft)", "stroke-width": 0.003 }));
    root.appendChild(el("text", { x: p.x, y: p.y + 0.022, "text-anchor": "middle",
      "font-size": 0.04, fill: "var(--ink-soft)" }, [p.id.toUpperCase()]));
  }
  scene.cue = createCueStick();
  scene.ballLayer = el("g", { class: "ball-layer" });
  scene.aim = el("g", { class: "aim-layer" });
  scene.fx = el("g", { class: "fx-layer" });
  scene.pockets = {};
  for (const p of pockets) scene.pockets[p.id] = { x: p.x, y: p.y };
  root.appendChild(scene.aim);
  root.appendChild(scene.cue);
  root.appendChild(scene.ballLayer);
  root.appendChild(scene.fx);
  scene.root = root;
  tableFrame.replaceChildren(root);
}

function updateScene(positions, playerColor, cueAngle) {
  if (!scene.root) createScene();
  updateCueStick(scene.cue, positions?.cue, cueAngle, playerColor);
  const live = new Set(Object.keys(positions ?? {}));
  for (const [id, p] of Object.entries(positions ?? {})) {
    let group = scene.balls.get(id);
    if (!group) {
      group = createBallNode(id);
      scene.balls.set(id, group);
      scene.ballLayer.appendChild(group);
    }
    updateBallNode(group, p);
    group.__p = p;
    if (id === "cue") lastCuePos = p;
  }
  for (const [id, group] of scene.balls) {
    if (!live.has(id) && !tweening.has(id)) group.setAttribute("display", "none");
  }
}

function setKpi() {
  document.getElementById("kpi-shot").textContent = kpi.shot;
  document.getElementById("kpi-turn").textContent = kpi.turn;
  document.getElementById("kpi-A").textContent = kpi.A;
  document.getElementById("kpi-B").textContent = kpi.B;
}

function appendLog(by, text, cls) {
  const empty = logEl.querySelector(".placeholder");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = `log-entry ${by}${cls ? ` ${cls}` : ""}`;
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = by;
  const tx = document.createElement("span");
  tx.className = cls || "";
  tx.textContent = text;
  div.appendChild(who);
  div.appendChild(tx);
  logEl.prepend(div);
  logEl.scrollTop = 0;
}

function resultLabel(shot) {
  if (shot.scratch) return "母球进袋";
  if (shot.foul) return `犯规：${shot.foul}`;
  if (shot.pottedBalls?.length > 0) return `进袋：${shot.pottedBalls.join("/")}`;
  return "未进";
}

function renderPublicPlan(shot) {
  const plan = shot.publicPlan;
  aiPhase.className = "ai-phase";
  aiPhase.textContent = `${shot.by} 计划已生成`;
  planObservation.textContent = plan?.observation ?? "本杆没有公开观察摘要";
  planChoice.textContent = plan?.choice ?? `${shot.targetBall ?? "?"} 号球 → ${shot.targetPocket ?? "未指定袋"}`;
  planCue.textContent = plan?.cuePlan ?? `力度 ${(shot.intentPower ?? 0).toFixed(2)}`;
  planRisk.textContent = plan?.risk ?? "未记录风险判断";
  const confidence = { low: "低", medium: "中", high: "高" }[plan?.confidence] ?? "未标注";
  planConfidence.innerHTML = `<span class="confidence"><i></i>${confidence}</span>`;
  planReview.textContent = "本杆结束后显示复盘";
}

async function renderShot(s, generation) {
  const displayShot = s.trial + 1;
  kpi.shot = displayShot;
  kpi.turn = s.by;
  setKpi();
  status.textContent = `▶ ${s.by} 正在击第 ${displayShot} 杆`;
  lastEventEl.textContent = `第 ${displayShot} 杆 · ${s.by} 正在执行计划`;
  const spinStr = s.intentSpin
    ? ` spin(${s.intentSpin.x.toFixed(2)},${s.intentSpin.y.toFixed(2)},${s.intentSpin.z.toFixed(2)})`
    : "";
  lastEventDetail.textContent =
    `${s.targetBall ?? "?"}→${s.targetPocket ?? "?"} 瞄 ${(s.intentAngle ?? 0).toFixed(1)}° 力 ${(s.intentPower ?? 0).toFixed(2)}${spinStr}`;
  renderPublicPlan(s);
  document.querySelector(".ai-panel")?.classList.remove("pulse");
  void document.querySelector(".ai-panel")?.offsetWidth;
  document.querySelector(".ai-panel")?.classList.add("pulse");
  await animateShot(s);
  if (generation !== playbackGeneration) return;
  if (s.pottedBalls?.length > 0) {
    if (s.by === "A") kpi.A += s.pottedBalls.length;
    else kpi.B += s.pottedBalls.length;
    if (!s.foul) {
      const balls = s.pottedBalls.join("、");
      if (lastPotBy === s.by) potStreak += 1;
      else { lastPotBy = s.by; potStreak = 1; }
      if (potStreak >= 2) {
        showCaption(`${names[s.by] ?? s.by} 连击 ×${potStreak}`, `连进 ${balls} 号球`, "streak", 1300);
      } else {
        showCaption(`⚫ ${balls} 号进袋`, s.pottedPockets?.[0] ? `${s.pottedPockets[0].pocket.toUpperCase()} 袋` : "", "streak", 1100);
      }
    }
  } else if (!s.foul) {
    lastPotBy = null;
    potStreak = 0;
  }
  const label = resultLabel(s);
  const cls = s.scratch ? "miss" : s.foul ? "foul" : s.pottedBalls?.length > 0 ? "pot" : "";
  lastEventEl.textContent = `第 ${displayShot} 杆 · ${s.by} ${label}`;
  planReview.textContent = s.review;
  aiPhase.textContent = "本杆已复盘";
  appendLog(s.by, `第${displayShot}杆 ${s.targetBall ?? "?"}→${s.targetPocket ?? "?"} 瞄${(s.intentAngle ?? 0).toFixed(0)}° ${label}`, cls);
  kpi.turn = s.nextTurn;
  setKpi();
}

/**
 * 轨迹插值播放（samples 按 t 推进；rate 倍速可调）
 * - 30ms 帧步（≈33fps）
 * - 命中 / pocket 时该球在下一个 sample 就从 pos 中消失，做"消失"动画
 */
let animFrame = null;
let animResolve = null;
function cancelAnimation() {
  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = null;
  animResolve?.();
  animResolve = null;
}
function expandSamples(s) {
  const input = s.samples || [];
  if (s.sampleMode !== "delta-v1") {
    const removals = [];
    let prev = null;
    for (const f of input) {
      if (prev) for (const id of Object.keys(prev)) if (!(id in f.pos)) removals.push({ t: f.t, id });
      prev = f.pos;
    }
    return { frames: input, removals };
  }
  const state = {};
  const frames = [];
  const removals = [];
  for (const sample of input) {
    for (const id of sample.removed ?? []) {
      removals.push({ t: sample.t, id });
      delete state[id];
    }
    for (const [id, pos] of Object.entries(sample.pos)) state[id] = { x: pos.x, y: pos.y };
    frames.push({ t: sample.t, pos: Object.fromEntries(Object.entries(state).map(([id, pos]) => [id, { ...pos }])) });
  }
  return { frames, removals };
}

function interpolateBalls(samples, targetT) {
  let lo = 0, hi = samples.length - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (samples[mid].t <= targetT) lo = mid;
    else hi = mid;
  }
  const s0 = samples[lo], s1 = samples[hi];
  const f = (targetT - s0.t) / Math.max(1e-6, s1.t - s0.t);
  const dt = Math.max(1e-6, s1.t - s0.t);
  const liveBalls = {};
  for (const id of new Set([...Object.keys(s0.pos), ...Object.keys(s1.pos)])) {
    const a = s0.pos[id], b = s1.pos[id];
    if (a && b) liveBalls[id] = { x: a.x + f * (b.x - a.x), y: a.y + f * (b.y - a.y),
      vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt };
    else if (a) liveBalls[id] = a;
    else if (b) liveBalls[id] = b;
  }
  return liveBalls;
}

/* ---------- 特效引擎 + 知行差距可视化 ---------- */
const tweening = new Set();
const FX = { items: [], raf: 0 };
const names = { A: "A", B: "B" };
let lastCuePos = null;
let lastPotBy = null;
let potStreak = 0;
let actCue = null, actObj = null, lastCuePt = null, lastObjPt = null;
const MOCKS = [
  "对手礼貌性地没有笑出声",
  "观众席传来一声轻咳",
  "母球表示想静静",
  "解说员沉默了两秒",
  "这一杆，收走了一颗白球",
  "掌声给了勇气，没给准度",
];

function fxAdd(item) {
  item.t0 = performance.now();
  FX.items.push(item);
  if (!FX.raf) FX.raf = requestAnimationFrame(fxFrame);
}
function fxFrame(now) {
  FX.items = FX.items.filter((it) => {
    const k = (now - it.t0 - (it.delay ?? 0)) / it.ms;
    if (k < 0) return true;
    const done = k >= 1;
    it.step(Math.min(1, k), now);
    if (done) it.end?.();
    return !done;
  });
  FX.raf = FX.items.length ? requestAnimationFrame(fxFrame) : 0;
}

function showCaption(main, sub, kind = "", ms = 1500) {
  captionEl.className = `caption ${kind}`;
  const esc = (t) => String(t).replaceAll("&", "&amp;").replaceAll("<", "&lt;");
  const subs = Array.isArray(sub) ? sub : sub ? [sub] : [];
  captionEl.innerHTML = `<b>${esc(main)}</b>${subs.map((t) => `<span>${esc(t)}</span>`).join("")}`;
  void captionEl.offsetWidth;
  captionEl.classList.add("show");
  clearTimeout(captionEl.__t1);
  clearTimeout(captionEl.__t2);
  captionEl.__t1 = setTimeout(() => captionEl.classList.add("out"), Math.max(0, ms - 380));
  captionEl.__t2 = setTimeout(() => { captionEl.className = "caption"; }, ms);
}

function shakeTable(hard) {
  tableFrame.classList.remove("shake", "shake-hard");
  void tableFrame.offsetWidth;
  tableFrame.classList.add(hard ? "shake-hard" : "shake");
}

function nearestPocket(p) {
  let best = "ct";
  let d0 = Infinity;
  for (const [id, c] of Object.entries(scene.pockets ?? {})) {
    const d = Math.hypot(c.x - p.x, c.y - p.y);
    if (d < d0) { d0 = d; best = id; }
  }
  return best;
}

function rayLen(x, y, dx, dy, maxLen) {
  let t = maxLen;
  if (dx > 1e-9) t = Math.min(t, (TABLE_W - R - x) / dx);
  if (dx < -1e-9) t = Math.min(t, (x - R) / -dx);
  if (dy > 1e-9) t = Math.min(t, (TABLE_H - R - y) / dy);
  if (dy < -1e-9) t = Math.min(t, (y - R) / -dy);
  return Math.max(0, t);
}

function drawPrediction(s, startPos) {
  if (scene.aim) {
    scene.aim.replaceChildren();
    scene.aim.style.opacity = "1";
  }
  const cue = startPos?.cue;
  const rad = ((s.intentAngle ?? 0) * Math.PI) / 180;
  const dx = Math.cos(rad), dy = -Math.sin(rad);
  if (cue && Number.isFinite(s.intentAngle)) {
    const len = rayLen(cue.x, cue.y, dx, dy, 1.9);
    if (len > 0.04) {
      scene.aim.appendChild(el("line", {
        class: "aim-pred",
        x1: cue.x + dx * R * 1.6, y1: cue.y + dy * R * 1.6,
        x2: cue.x + dx * (R * 1.6 + len), y2: cue.y + dy * (R * 1.6 + len),
      }));
    }
  }
  const tb = s.targetBall;
  const pk = tb && s.targetPocket ? scene.pockets?.[s.targetPocket] : null;
  const tPos = tb ? startPos?.[tb] : null;
  if (tPos && pk) {
    scene.aim.appendChild(el("line", {
      class: "aim-pred aim-obj", x1: tPos.x, y1: tPos.y, x2: pk.x, y2: pk.y,
    }));
  }
  actCue = el("polyline", { class: "aim-act" });
  scene.aim.appendChild(actCue);
  actObj = null;
  lastCuePt = null;
  lastObjPt = null;
  if (tb) {
    actObj = el("polyline", { class: "aim-act" });
    scene.aim.appendChild(actObj);
  }
}

function pushActual(live, s) {
  const push = (line, p, last) => {
    if (!line || !p) return last;
    if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 0.006) {
      line.__pts = `${line.__pts ?? ""}${p.x.toFixed(3)},${p.y.toFixed(3)} `;
      line.setAttribute("points", line.__pts);
      return p;
    }
    return last;
  };
  lastCuePt = push(actCue, live.cue, lastCuePt);
  lastObjPt = push(actObj, live[s.targetBall ?? ""], lastObjPt);
}

function fadeAimLater() {
  setTimeout(() => {
    if (scene.aim) scene.aim.style.opacity = "0";
  }, 1500);
}

/* 进球：袋口金圈闪光 + 球被吸入袋口 */
function potFlash(pocketId) {
  const pk = scene.pockets?.[pocketId];
  if (!pk || !scene.fx || reduceMotion) return;
  for (let i = 0; i < 2; i++) {
    const ring = el("circle", { class: "fx-pot", cx: pk.x, cy: pk.y, r: 0.03,
      fill: "none", stroke: "#E8B84B", "stroke-width": 0.005 });
    scene.fx.appendChild(ring);
    fxAdd({ ms: 520 + i * 150, delay: i * 110, step: (k) => {
      ring.setAttribute("r", String(0.03 + k * (0.09 + i * 0.04)));
      ring.setAttribute("opacity", String(0.9 * (1 - k)));
    }, end: () => ring.remove() });
  }
  const glow = el("circle", { cx: pk.x, cy: pk.y, r: 0.05, fill: "#E8B84B", opacity: 0.5 });
  scene.fx.appendChild(glow);
  fxAdd({ ms: 400, step: (k) => {
    glow.setAttribute("r", String(0.05 + k * 0.025));
    glow.setAttribute("opacity", String(0.5 * (1 - k)));
  }, end: () => glow.remove() });
}

function absorbBall(id, pocketId) {
  const group = scene.balls.get(id);
  const pk = scene.pockets?.[pocketId];
  if (!group || !pk || reduceMotion) return;
  const from = group.__p ?? pk;
  tweening.add(id);
  fxAdd({ ms: 340, step: (k) => {
    const e = k * k;
    const x = from.x + (pk.x - from.x) * e;
    const y = from.y + (pk.y - from.y) * e;
    group.setAttribute("transform", `translate(${x} ${y}) scale(${1 - 0.72 * e})`);
    group.setAttribute("opacity", String(1 - 0.55 * e));
  }, end: () => {
    group.setAttribute("display", "none");
    group.setAttribute("opacity", "1");
    tweening.delete(id);
  } });
}

/* 开球：接触点冲击波 + 震屏 + 字幕 */
function showBreakShock(x, y, by) {
  if (!scene.fx || reduceMotion) return;
  for (let i = 0; i < 3; i++) {
    const ring = el("circle", { cx: x, cy: y, r: 0.02, fill: "none",
      stroke: "rgba(247,244,238,.9)", "stroke-width": 0.005 });
    scene.fx.appendChild(ring);
    fxAdd({ ms: 720, delay: i * 90, step: (k) => {
      ring.setAttribute("r", String(0.02 + k * (0.48 + i * 0.16)));
      ring.setAttribute("opacity", String(0.9 * (1 - k) * (1 - k)));
    }, end: () => ring.remove() });
  }
  shakeTable(false);
  showCaption("💥 开球", `${names[by] ?? by} 冲击球堆`, "break", 1200);
}

/* 白球进袋：全场暗场 + 袋口聚光灯 + 白球幽灵（画 × 眼）+ 嘲讽字幕 + 重震 */
function showScratchMock(s) {
  if (!scene.fx || reduceMotion) return;
  const pk = scene.pockets?.[nearestPocket(lastCuePos ?? { x: TABLE_W / 2, y: TABLE_H / 2 })];
  if (!pk) return;
  const dim = el("rect", { x: 0, y: 0, width: TABLE_W, height: TABLE_H, fill: "#0B1410", opacity: 0 });
  const pool = el("circle", { cx: pk.x, cy: pk.y, r: 0.17, fill: "#F5E6B8", opacity: 0 });
  const core = el("circle", { cx: pk.x, cy: pk.y, r: 0.07, fill: "#FFF6DE", opacity: 0 });
  const ghost = el("g", { opacity: 0 }, [
    el("circle", { cx: pk.x, cy: pk.y, r: R, fill: "#FAFAF7", stroke: "#343A3D", "stroke-width": 0.0025 }),
    el("line", { x1: pk.x - 0.007, y1: pk.y - 0.007, x2: pk.x + 0.007, y2: pk.y + 0.007,
      stroke: "#8C2F3C", "stroke-width": 0.003 }),
    el("line", { x1: pk.x + 0.007, y1: pk.y - 0.007, x2: pk.x - 0.007, y2: pk.y + 0.007,
      stroke: "#8C2F3C", "stroke-width": 0.003 }),
  ]);
  scene.fx.append(dim, pool, core, ghost);
  fxAdd({ ms: 2300, step: (k, now) => {
    const inn = Math.min(1, k * 4);
    const out = Math.max(0, k * 4 - 3);
    dim.setAttribute("opacity", String(0.5 * inn * (1 - out)));
    const flick = 0.9 + 0.1 * Math.sin(now / 90);
    pool.setAttribute("opacity", String(0.22 * inn * flick * (1 - out)));
    core.setAttribute("opacity", String(0.38 * inn * (1 - out)));
    ghost.setAttribute("opacity", String(inn * (k > 0.12 ? (0.5 + 0.5 * Math.sin(now / 160)) : 1) * (1 - out)));
  }, end: () => { dim.remove(); pool.remove(); core.remove(); ghost.remove(); } });
  shakeTable(true);
  // 打脸字幕：引用 AI 自己刚说的原话（走位/风险优先——"低杆防 scratch"型发言最讽刺）
  const plan = s.publicPlan;
  const quote = plan
    ? [plan.cuePlan, plan.risk, plan.choice].find((t) => t && !t.includes("外部选手") && t.trim().length > 3)
    : null;
  const subs = quote
    ? [`它刚说：「${quote.slice(0, 60)}」`, MOCKS[s.trial % MOCKS.length]]
    : [MOCKS[s.trial % MOCKS.length]];
  showCaption("母球进袋", subs, "mock", quote ? 3000 : 2300);
}

/* 胜负：金色粒子爆发 + 字幕 */
function showVictory(winner, msg) {
  if (!scene.fx || reduceMotion) return;
  const cx = TABLE_W / 2, cy = TABLE_H / 2;
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * Math.PI * 2 + 0.13;
    const c = el("circle", { cx, cy, r: 0.012, fill: i % 3 ? "#E8B84B" : "#F5E6B8" });
    scene.fx.appendChild(c);
    fxAdd({ ms: 950 + (i % 5) * 110, step: (k) => {
      const d = 0.08 + k * (0.72 + (i % 4) * 0.12);
      c.setAttribute("cx", String(cx + Math.cos(a) * d));
      c.setAttribute("cy", String(cy + Math.sin(a) * d * 0.62));
      c.setAttribute("opacity", String(1 - k));
    }, end: () => c.remove() });
  }
  const reason = (msg.reason ?? "").replaceAll("——", "：");
  showCaption(`🏆 ${names[winner] ?? winner} 胜`, reason, "victory", 2800);
}

function onRemoval(s, r) {
  if (r.id === "cue") {
    absorbBall("cue", nearestPocket(scene.balls.get("cue")?.__p ?? { x: TABLE_W / 2, y: TABLE_H / 2 }));
    return;
  }
  const pocketId = s.pottedPockets?.find((p) => p.ball === r.id)?.pocket;
  if (!pocketId) return;
  absorbBall(r.id, pocketId);
  potFlash(pocketId);
}

function detectBreak(live, by) {
  const cue = live.cue;
  if (!cue) return false;
  for (const [id, p] of Object.entries(live)) {
    if (id === "cue") continue;
    if (Math.hypot(p.x - cue.x, p.y - cue.y) < 2 * R + 0.006) {
      showBreakShock(p.x, p.y, by);
      return true;
    }
  }
  return false;
}

function clearAimFx() {
  if (scene.aim) {
    scene.aim.replaceChildren();
    scene.aim.style.opacity = "1";
  }
  if (scene.fx) scene.fx.replaceChildren();
  for (const it of FX.items) it.end?.();
  FX.items = [];
  tweening.clear();
  lastPotBy = null;
  potStreak = 0;
  lastCuePos = null;
  captionEl.className = "caption";
}

function animateShot(s) {
  cancelAnimation();
  const samples = expandSamples(s);
  if (samples.frames.length < 2) {
    updateScene(s.finalBalls);
    return Promise.resolve();
  }
  if (reduceMotion) {
    updateScene(s.finalBalls);
    return Promise.resolve();
  }
  const t0 = samples.frames[0].t;
  const tEnd = samples.frames[samples.frames.length - 1].t;
  const dur = Math.max(1.5, Math.min(8, tEnd - t0));
  const cueHold = Array.isArray(embeddedEvents) ? 1200 : 850;
  let playbackMs = 0;
  let lastNow = performance.now();
  let broken = false;
  let removalIdx = 0;
  let scratchShown = false;
  const removals = samples.removals;
  // 球员色：A 蓝、B 橙；瞄准线虚色用同色
  const playerColor = s.by === "A" ? "var(--A)" : "var(--B)";
  drawPrediction(s, samples.frames[0].pos);

  return new Promise((resolve) => {
    animResolve = resolve;
    function frame() {
      const now = performance.now();
      const delta = now - lastNow;
      lastNow = now;
      if (paused) {
        animFrame = requestAnimationFrame(frame);
        return;
      }
      playbackMs += delta * playbackSpeed;
      if (playbackMs < cueHold) {
        updateScene(samples.frames[0].pos, playerColor, s.intentAngle);
        animFrame = requestAnimationFrame(frame);
        return;
      }
      const elapsed = (playbackMs - cueHold) / 1000;
      const tv = elapsed / dur;
      if (tv >= 1) {
        updateScene(s.finalBalls);
        fadeAimLater();
        if (s.scratch && !scratchShown) {
          scratchShown = true;
          showScratchMock(s);
        }
        animFrame = null;
        animResolve = null;
        resolve();
        return;
      }
      const targetT = t0 + tv * (tEnd - t0);
      const liveBalls = interpolateBalls(samples.frames, targetT);
      pushActual(liveBalls, s);
      updateScene(liveBalls, playerColor);
      if (!broken && s.trial === 0) broken = detectBreak(liveBalls, s.by);
      while (removalIdx < removals.length && removals[removalIdx].t <= targetT) {
        onRemoval(s, removals[removalIdx]);
        removalIdx++;
      }
      if (s.scratch && !scratchShown && !liveBalls.cue) {
        scratchShown = true;
        showScratchMock(s);
      }
      animFrame = requestAnimationFrame(frame);
    }
    animFrame = requestAnimationFrame(frame);
  });
}

let playback = Promise.resolve();
let playbackGeneration = 0;
let currentEvents = [];

/* 读人高光：金环凝视特效 + 字幕（心理层招牌时刻）；带推理时展示模型原文 */
function renderRead(msg, generation) {
  if (generation !== playbackGeneration) return;
  const readerName = names[msg.reader] ?? msg.reader;
  const dirText = msg.directionCorrect ? "方向读对" : "方向读错";
  const dirKind = msg.directionCorrect ? "✓" : "✗";
  showCaption(
    `👁 ${readerName} 读人：${msg.estimateDeg.toFixed(3)}°`,
    msg.rationale
      ? `${msg.rationale}`
      : `误差 ${msg.errorDeg.toFixed(3)}° · ${dirText} ${dirKind} · 剩余 ${msg.attemptsLeft} 次`,
    "read",
    3600,
  );
  if (!reduceMotion && scene.fx) {
    const cx = TABLE_W / 2, cy = TABLE_H / 2;
    // 金环双击：从中心扩散再回收（凝视的意象）
    for (let i = 0; i < 2; i++) {
      const ring = el("circle", { cx, cy, r: 0.06, fill: "none",
        stroke: i ? "#E8B84B" : "#F5E6B8", "stroke-width": 0.004, opacity: 0 });
      scene.fx.appendChild(ring);
      fxAdd({ ms: 900, delay: i * 260, step: (k) => {
        const grow = k < 0.45 ? k / 0.45 : 1 - (k - 0.45) / 0.55;
        ring.setAttribute("r", String(0.06 + grow * 0.3));
        ring.setAttribute("opacity", String(0.85 * grow));
      }, end: () => ring.remove() });
    }
    // 眼睛意象：中心水平凝视线
    const gaze = el("line", { x1: cx - 0.22, y1: cy, x2: cx + 0.22, y2: cy,
      stroke: "#F5E6B8", "stroke-width": 0.0035, "stroke-linecap": "round", opacity: 0 });
    scene.fx.appendChild(gaze);
    fxAdd({ ms: 700, delay: 200, step: (k) => {
      const inn = Math.min(1, k * 3);
      const out = Math.max(0, k * 3 - 2);
      gaze.setAttribute("x1", String(cx - 0.22 * inn * (1 - out * 0.6)));
      gaze.setAttribute("x2", String(cx + 0.22 * inn * (1 - out * 0.6)));
      gaze.setAttribute("opacity", String(0.9 * inn * (1 - out)));
    }, end: () => gaze.remove() });
  }
  appendLog(msg.reader,
    `读人：估 ${msg.estimateDeg.toFixed(3)}° → 误差 ${msg.errorDeg.toFixed(3)}°（${dirText}）`,
    msg.directionCorrect ? "pot" : "miss");
  if (msg.rationale) {
    // 推理原文进 AI 思路面板（观众叙事）
    lastEventEl.textContent = `👁 ${readerName} 的读人推理`;
    lastEventDetail.textContent = msg.rationale;
    planReview.textContent = `估计 ${msg.estimateDeg.toFixed(3)}° → 服务端误差 ${msg.errorDeg.toFixed(3)}°（${dirText} ${dirKind}）`;
    document.querySelector(".ai-panel")?.classList.add("pulse");
    setTimeout(() => document.querySelector(".ai-panel")?.classList.remove("pulse"), 3600);
  }
}

function renderSummary(msg, generation) {
  if (generation !== playbackGeneration) return;
  const w = msg.winner === "A" ? "A 胜" : msg.winner === "B" ? "B 胜" : "平局";
  const color = msg.winner === "A" ? "var(--A)" : msg.winner === "B" ? "var(--B)" : "var(--ink-soft)";
  const reason = (msg.reason ?? "").replaceAll("——平局", "").replaceAll("——", "：");
  if (msg.winner && !reduceMotion) showVictory(msg.winner, msg);
  else showCaption(w, reason || "杆数耗尽", "victory", 2200);
  status.innerHTML = `<b style="color:${color}">${w}</b>${reason ? `：${reason}` : ""}（${msg.shots} 杆）`;
  aiPhase.textContent = "对局结束";
  replayButton.disabled = false;
}

function beginSession(msg) {
  playbackGeneration += 1;
  cancelAnimation();
  playback = Promise.resolve();
  paused = false;
  pauseButton.textContent = "Ⅱ 暂停";
  pauseButton.disabled = false;
  replayButton.disabled = true;
  kpi.shot = 0; kpi.turn = "-"; kpi.A = 0; kpi.B = 0;
  setKpi();
  clearAimFx();
  lastEventEl.textContent = "—";
  lastEventDetail.textContent = "AI 选择目标后将在这里展示公开计划";
  aiPhase.className = "ai-phase";
  aiPhase.textContent = "等待分析";
  planObservation.textContent = "—";
  planChoice.textContent = "—";
  planCue.textContent = "—";
  planRisk.textContent = "—";
  planConfidence.textContent = "—";
  planReview.textContent = "本杆结束后显示复盘";
  const empty = document.createElement("div");
  empty.className = "placeholder";
  empty.textContent = "等待首杆...";
  logEl.replaceChildren(empty);
  if (msg.maxShots) maxShotsInput.value = String(msg.maxShots);
}

function applyControlNotice(msg) {
  controlStatus.textContent = msg.message;
  const loading = ["starting", "thinking", "playing"].includes(msg.state);
  newMatchButton.disabled = loading || !socket || socket.readyState !== WebSocket.OPEN;
  maxShotsInput.disabled = loading;
  if (msg.state === "thinking") {
    aiPhase.className = "ai-phase thinking";
    aiPhase.textContent = msg.message;
    planReview.textContent = "正在读取局面并形成公开计划";
  }
}

function handle(msg, record = true) {
  if (msg.type === "control") {
    applyControlNotice(msg);
    return;
  }
  if (record) {
    if (msg.type === "hello") currentEvents = [msg];
    else currentEvents.push(msg);
  }
  if (msg.type === "hello") {
    beginSession(msg);
    if (msg.table) {
      TABLE_W = msg.table.width;
      TABLE_H = msg.table.height;
      BREAK_LINE_X = msg.table.breakLineX;
      FOOT_SPOT_X = msg.table.footSpotX;
    }
    document.getElementById("meta").innerHTML =
      `seed <b>${msg.seed}</b> · <span class="A">A: ${msg.nameA}</span> vs <span class="B">B: ${msg.nameB}</span>` +
      (msg.promptA ? `<br/><span style="font-size:11px">promptA=${msg.promptA} · promptB=${msg.promptB}</span>` : "");
    names.A = msg.nameA || "A";
    names.B = msg.nameB || "B";
    if (scene.root) createScene();
    status.textContent = "🔵 等待首杆";
    updateScene(null);
    lastPotBy = null;
    potStreak = 0;
  } else if (msg.type === "shot") {
    const generation = playbackGeneration;
    playback = playback.then(() =>
      generation === playbackGeneration ? renderShot(msg, generation) : undefined,
    );
  } else if (msg.type === "read") {
    const generation = playbackGeneration;
    playback = playback.then(() =>
      generation === playbackGeneration ? renderRead(msg, generation) : undefined,
    );
  } else if (msg.type === "summary") {
    const generation = playbackGeneration;
    playback = playback.then(() => renderSummary(msg, generation));
  }
}

const status = document.getElementById("status");
const tableFrame = document.getElementById("table");
const captionEl = document.getElementById("caption");
const lastEventEl = document.getElementById("last-event");
const lastEventDetail = document.getElementById("last-event-detail");
const logEl = document.getElementById("log");
const stage = document.getElementById("stage");
const newMatchButton = document.getElementById("new-match");
const pauseButton = document.getElementById("pause-playback");
const replayButton = document.getElementById("replay-match");
const speedSelect = document.getElementById("playback-speed");
const maxShotsInput = document.getElementById("max-shots");
const fullscreenButton = document.getElementById("fullscreen-table");
const controlStatus = document.getElementById("control-status");
const aiPhase = document.getElementById("ai-phase");
const planObservation = document.getElementById("plan-observation");
const planChoice = document.getElementById("plan-choice");
const planCue = document.getElementById("plan-cue");
const planRisk = document.getElementById("plan-risk");
const planConfidence = document.getElementById("plan-confidence");
const planReview = document.getElementById("plan-review");
let socket = null;

function togglePause() {
  if (pauseButton.disabled) return;
  paused = !paused;
  pauseButton.textContent = paused ? "▶ 继续" : "Ⅱ 暂停";
  controlStatus.textContent = paused ? "已暂停" : "播放中";
  showFullscreenControls();
}

function replayCurrentMatch() {
  if (replayButton.disabled || currentEvents.length === 0) return;
  const events = [...currentEvents];
  for (const event of events) handle(event, false);
  controlStatus.textContent = "重新播放";
}

function requestNewMatch() {
  const maxShots = Number(maxShotsInput.value);
  if (!Number.isInteger(maxShots) || maxShots < 1 || maxShots > 120) {
    maxShotsInput.focus();
    controlStatus.textContent = "最大杆数需为 1–120";
    return;
  }
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  newMatchButton.disabled = true;
  maxShotsInput.disabled = true;
  controlStatus.textContent = "新局准备中";
  socket.send(JSON.stringify({ type: "new_match", maxShots }));
}

async function toggleFullscreen() {
  try {
    if (document.fullscreenElement === stage) await document.exitFullscreen();
    else await stage.requestFullscreen();
  } catch {
    controlStatus.textContent = "浏览器不支持全屏";
  }
}

let fullscreenTimer = null;
function showFullscreenControls() {
  if (document.fullscreenElement !== stage) return;
  stage.classList.add("controls-visible");
  clearTimeout(fullscreenTimer);
  fullscreenTimer = setTimeout(() => {
    if (!stage.querySelector(".controls:focus-within") && !paused) {
      stage.classList.remove("controls-visible");
    }
  }, 1800);
}

newMatchButton.addEventListener("click", requestNewMatch);
pauseButton.addEventListener("click", togglePause);
replayButton.addEventListener("click", replayCurrentMatch);
speedSelect.addEventListener("change", () => {
  playbackSpeed = Number(speedSelect.value);
  controlStatus.textContent = `${speedSelect.value}× 播放`;
});
fullscreenButton.addEventListener("click", toggleFullscreen);
stage.addEventListener("pointermove", showFullscreenControls);
stage.addEventListener("keydown", showFullscreenControls);
document.addEventListener("fullscreenchange", () => {
  const active = document.fullscreenElement === stage;
  fullscreenButton.textContent = active ? "退出全屏" : "⛶ 全屏球桌";
  stage.classList.toggle("controls-visible", active);
  if (active && !fullscreenButton.matches(":focus-visible")) fullscreenButton.blur();
  if (active) showFullscreenControls();
});
document.addEventListener("keydown", (event) => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
  if (event.code === "Space") { event.preventDefault(); togglePause(); }
  if (event.key.toLowerCase() === "f") toggleFullscreen();
  if (event.key.toLowerCase() === "r") replayCurrentMatch();
});

function connectLive() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  // 大厅模式（/table/<id>）：同源单端口 /ws/<id>；web-match 单桌模式：WS = HTTP 端口 - 1
  const lobbyTable = location.pathname.match(/^\/table\/([^/]+)/);
  if (lobbyTable) {
    socket = new WebSocket(`${proto}//${location.host}/ws/${lobbyTable[1]}`);
  } else {
    const wsPort = parseInt(location.port || "8788", 10) - 1;
    socket = new WebSocket(`${proto}//${location.hostname}:${wsPort}`);
  }
  socket.addEventListener("open", () => {
    status.textContent = "🟢 已连接，等待首杆";
    controlStatus.textContent = "已连接";
    newMatchButton.disabled = false;
  });
  socket.addEventListener("close", () => {
    status.textContent = "🔴 连接断开";
    controlStatus.textContent = "连接断开";
    newMatchButton.disabled = true;
  });
  socket.addEventListener("error", () => { status.textContent = "⚠️ 连接错误"; });
  socket.addEventListener("message", (e) => {
    try { handle(JSON.parse(e.data)); } catch (err) { console.error("parse error", err); }
  });
}

if (Array.isArray(embeddedEvents)) {
  document.body.classList.add("offline");
  playbackSpeed = 1;
  speedSelect.value = "1";
  controlStatus.textContent = "离线回放";
  status.textContent = "▶ 正在播放离线回放";
  for (const event of embeddedEvents) handle(event);
} else {
  connectLive();
}
setKpi();
</script>
